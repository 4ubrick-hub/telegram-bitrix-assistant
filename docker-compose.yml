version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bitrix_assistant_db
    environment:
      POSTGRES_USER: assistant_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: bitrix_assistant
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant_user -d bitrix_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitrix_network

  # Redis (optional, для кеширования и очередей)
  redis:
    image: redis:7-alpine
    container_name: bitrix_assistant_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitrix_network

  # PgAdmin (Web interface для PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bitrix_assistant_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bitrix_network

volumes:
  postgres_data:
    driver: local

networks:
  bitrix_network:
    driver: bridge
